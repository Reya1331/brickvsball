<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Breakout Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0b0b10;--line:#2c2c3a;--ink:#f2f2f2;--mute:#8f8fa0;--p1:#2f9bff;--p2:#ff4d3d;--gold:#ffe14a}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font:19px/1.1 VT323,'Courier New',monospace;user-select:none;-webkit-user-select:none}
#app{display:flex;gap:12px;justify-content:center;align-items:flex-start;padding:12px;flex-wrap:wrap}
#mid{flex:1 1 560px;max-width:864px;min-width:300px;order:2;position:relative}
#p0{order:1;border-color:var(--p1)}#p1{order:3;border-color:var(--p2)}
.pn{width:312px;background:var(--panel);border:3px solid;padding:10px 12px;max-height:calc(100vh - 24px);overflow-y:auto;scrollbar-width:thin}
.ph{display:flex;align-items:center;gap:8px}
.ph h2{margin:0;font:12px 'Press Start 2P',monospace;flex:1}
.ph b{font:18px 'Press Start 2P',monospace;color:var(--gold)}
.ph span{color:var(--mute)}
.sub{color:var(--mute);margin:6px 0}
.pl{display:flex;align-items:center;gap:8px;margin:2px 0 10px}
.pd{color:var(--mute);font-size:16px;line-height:1}
button{font:inherit;color:var(--ink);cursor:pointer;background:#15151f;border:2px solid #4a4a5e;border-radius:0;padding:3px 8px}
button:hover{background:#25253a;border-color:#8a8aa8}
button:active{transform:translateY(1px)}
button:focus-visible{outline:2px solid var(--gold)}
.off,.off:hover{opacity:.35;cursor:default;background:#15151f;border-color:#4a4a5e}
.pb{white-space:nowrap}.pb.arm{background:#2a3d66;border-color:#8fb4ff}
.card{border-top:2px solid #22222c}
.hd{display:flex;align-items:center;gap:6px;padding:4px 0}
.tg{flex:1;display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;padding:2px;font-size:21px}
.tg:hover{background:none;color:#fff}
.tg::after{content:'>';color:var(--mute);margin-left:auto;transition:transform .15s}
.card.open .tg::after{transform:rotate(90deg)}
.ic{width:26px;height:26px;flex:none}
.cn{color:var(--mute)}
.buy{min-width:84px}
.bd{display:none;padding:0 0 10px 4px}.card.open .bd{display:block}
.ds{margin:0 0 6px;color:var(--mute);font-size:17px}
.st{margin:0 0 6px;color:#c9d3ea;font-size:17px;border-left:3px solid var(--gold);padding-left:6px}
.u{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 0;border-top:1px dashed #2c2c3a}
.ut{display:flex;align-items:center;gap:8px;font-size:20px}
.seg{display:inline-flex;gap:3px}
.seg i{width:9px;height:9px;border:1px solid #666;display:block}
.seg i.on{background:var(--gold);border-color:var(--gold)}
.ud{color:var(--mute);font-size:16px}
.uv{font-size:18px;display:flex;gap:6px;align-items:center}
.uv em{font-style:normal;color:var(--mute)}.uv .nx{color:#6bff95}.uv .nx.mx{color:var(--mute)}
.ub{grid-column:2;grid-row:1/4;align-self:center;min-width:64px;display:flex;flex-direction:column;align-items:center;line-height:1}
.ub b{font:12px 'Press Start 2P',monospace;color:var(--gold);padding:2px 0 3px}
.ub small{font-size:15px;color:var(--mute)}
canvas{width:100%;display:block;background:#000;border:3px solid #444}
.ic{border:0}
.bars{display:flex;gap:10px;margin-bottom:8px}
.bars div{flex:1;height:12px;background:#15151f;border:2px solid #444;display:flex}
.bars div:last-child{justify-content:flex-end}
.bars i{display:block;height:100%;transition:width .2s}
#h0{background:var(--p1)}#h1{background:var(--p2)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--mute)}
.ctl button.on{background:#2a3d66;border-color:#8fb4ff}
.hint{color:var(--mute);font-size:16px;margin:8px 0 0;line-height:1.1}
#win{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:18px;background:rgba(0,0,0,.85);font:26px 'Press Start 2P',monospace}
#win button{font-size:20px;padding:6px 18px}
</style></head><body>
<div id="app">
 <div class="pn" id="p0"></div>
 <div id="mid">
  <div class="bars"><div><i id="h0"></i></div><div><i id="h1"></i></div></div>
  <canvas id="cv"></canvas>
  <div class="ctl"><span id="hud"></span>
   <span id="spd"><button data-s="0">Pause</button> <button data-s="1" class="on">1x</button> <button data-s="2">2x</button> <button data-s="4">4x</button></span></div>
  <p class="hint" id="hint"></p>
  <div id="win"><span id="wt"></span><button id="re">Rematch</button></div>
 </div>
 <div class="pn" id="p1"></div>
</div>
<script>
/* =====================================================================
   CONFIG: edit numbers here. Everything else reads from this block.
   ===================================================================== */
const CFG={
 brickHP:5,          // HP of every brick
 brickText:true,     // show the HP number on each brick
 placeBricks:12,     // 1 HP bricks each player can place anywhere on their half (new brick, or +1 HP on an existing one)
 brickCap:10,        // max HP a reinforced brick can reach
 startCoins:40,
 coinsPerHP:5,       // coins earned per HP of enemy brick damage
 trickle:2,          // passive coins per second
 ballCap:30,         // max balls per player
 miniCap:40,         // max live scatter minis per player
 buyGrow:1.22,       // each extra copy of a ball costs this much more
 upGrow:1.6,         // default upgrade cost growth per level (per-ball override: upGrow)
 maxLevel:5,         // levels per upgrade
 unit:80,            // pixels per second for 1.0 speed
 suddenDeath:{start:300,len:300,floor:.15} // after start seconds, healing fades to floor over len seconds
};
/* Each ball:
   cost    price of the first extra copy (Basic's first copy is free)
   upBase  price of an upgrade's first level (default: 0.9 x cost, min 20)
   upGrow  upgrade cost growth per level (default CFG.upGrow)
   base    stats at level 0
   ups     upgrades: [name, description, display(stats), effects]
           effects: {stat:['+',perLevel,{min,max,int}]} adds, {stat:['*',perLevel]} scales by (1+perLevel*level)
   info    the "Now:" line in the shop
   Stats: dmg, heal, spd (speed). Special: sp/hs plasma splash dmg/heal, ct/pn/pb sniper charge time/pierced
   bricks/bonus per brick, mn/ml/md/mh/msp scatter mini count/bounces/dmg/heal/speed, fr/sh cannon friendly dmg/shockwave,
   au medic aura, turn homing turn rate (rad/s). */
const f=x=>+x.toFixed(2),pc=x=>Math.round(x*100)+'%';
const BALLS=[
{id:'basic',name:'Basic',color:'#f2f5ff',r:6,cost:10,
 desc:'Reliable all-rounder. Damages enemy bricks, heals your own.',
 base:{dmg:1,spd:1.05,heal:.3},
 ups:[['Sharpened Edge','Damage on enemy bricks',s=>f(s.dmg)+' dmg',{dmg:['+',.25]}],
      ['Tailwind','Ball speed',s=>f(s.spd)+' spd',{spd:['*',.8]}],
      ['Soft Core','Healing on your bricks',s=>f(s.heal)+' heal',{heal:['+',.15]}]],
 info:s=>`${f(s.dmg)} dmg · ${f(s.heal)} heal · ${f(s.spd)} spd`},
{id:'plasma',name:'Plasma',color:'#b987ff',r:8,cost:70,upBase:100,upGrow:1.6,
 desc:'Slow and heavy. Splashes damage (or healing) to every touching brick. Weak until upgraded.',
 base:{dmg:.75,spd:.61,sp:.25,heal:.15,hs:.5},
 ups:[['Overcharge','Direct damage',s=>f(s.dmg)+' dmg',{dmg:['+',.3]}],
      ['Chain Reaction','Splash damage to touching bricks',s=>pc(s.sp),{sp:['+',.15]}],
      ['Ion Field','Healing (splash is half of it)',s=>f(s.heal)+' heal',{heal:['+',.1]}],
      ['Thrusters','Ball speed',s=>f(s.spd)+' spd',{spd:['*',.9]}]],
 info:s=>`${f(s.dmg)} dmg, ${pc(s.sp)} splash · ${f(s.heal)} heal, ${pc(s.hs)} splash · ${f(s.spd)} spd`},
{id:'sniper',name:'Sniper',color:'#ffe14a',r:5,cost:80,
 desc:'Weak hits, but its glowing charged shot punches through a line of bricks. No healing.',
 base:{dmg:.4,spd:1.05,ct:3,pn:2,pb:.2},
 ups:[['Scope','Time to recharge the piercing shot',s=>f(s.ct)+'s',{ct:['+',-.35,{min:1.25}]}],
      ['Armor-Piercing','Bricks pierced behind the target',s=>s.pn+' bricks',{pn:['+',.5,{int:true}]}],
      ['Hollow Point','Bonus damage per brick pierced',s=>'+'+f(s.pb)+' each',{pb:['+',.08]}],
      ['Light Rifle','Ball speed',s=>f(s.spd)+' spd',{spd:['*',.8]}]],
 info:s=>`${f(s.dmg)} dmg · shot every ${f(s.ct)}s pierces ${s.pn}, +${f(s.pb)} per brick · ${f(s.spd)} spd`},
{id:'scatter',name:'Scatter',color:'#4affc8',r:6,cost:200,
 desc:'Fast. Every wall or brick hit spawns mini balls: damage minis off enemy bricks, heal minis off yours, either off walls.',
 base:{dmg:.5,spd:1.4,mn:2,ml:2,md:.3,mh:.6,msp:3.5},
 ups:[['Extra Shrapnel','Minis spawned per hit',s=>s.mn+' minis',{mn:['+',.5,{int:true}]}],
      ['Long Fuse','Bounces before a mini fades',s=>s.ml+' bounces',{ml:['+',1]}],
      ['Fragmentation','Mini damage and heal',s=>`${f(s.md)} dmg / ${f(s.mh)} heal`,{md:['+',.12],mh:['+',.2]}],
      ['Rocket Fuel','Ball speed',s=>f(s.spd)+' spd',{spd:['*',.8]}]],
 info:s=>`${f(s.dmg)} dmg · ${s.mn} minis/hit (${f(s.md)} dmg or ${f(s.mh)} heal, ${s.ml} bounces) · ${f(s.spd)} spd`},
{id:'cannon',name:'Cannonball',color:'#ff9a3c',r:10,cost:220,upBase:150,upGrow:1.65,
 desc:'Slowest ball, biggest hit. Hurts your own bricks too, so keep it away from home.',
 base:{dmg:3,spd:.53,fr:2,sh:0},
 ups:[['Heavier Powder','Damage on enemy bricks',s=>f(s.dmg)+' dmg',{dmg:['+',.8]}],
      ['Padded Casing','Damage dealt to your own bricks',s=>f(s.fr)+' dmg',{fr:['+',-.3,{min:.5}]}],
      ['Shockwave','Damage to bricks touching the target',s=>pc(s.sh),{sh:['+',.15]}],
      ['Propellant','Ball speed',s=>f(s.spd)+' spd',{spd:['*',1]}]],
 info:s=>`${f(s.dmg)} dmg enemy · ${f(s.fr)} own bricks · ${pc(s.sh)} shockwave · ${f(s.spd)} spd`},
{id:'medic',name:'Medic',color:'#5aff7a',r:7,cost:30,
 desc:'No damage. Heals your bricks it touches; ignores enemy bricks.',
 base:{heal:1.2,au:0,spd:.88},
 ups:[['Stronger Serum','Healing per hit',s=>f(s.heal)+' heal',{heal:['+',.4]}],
      ['Healing Aura','Heal on bricks touching the target',s=>pc(s.au),{au:['+',.15]}],
      ['Quick Cart','Ball speed',s=>f(s.spd)+' spd',{spd:['*',.8]}]],
 info:s=>`${f(s.heal)} heal · ${pc(s.au)} aura · ${f(s.spd)} spd`},
{id:'homing',name:'Homing',color:'#ff6bd6',r:6,cost:55,
 desc:'Steers toward the nearest enemy brick. Needs Tracking upgrades to steer well. No healing.',
 base:{dmg:.8,spd:1.05,turn:.3},
 ups:[['Warhead','Damage on enemy bricks',s=>f(s.dmg)+' dmg',{dmg:['+',.25]}],
      ['Tracking','How sharply it steers',s=>f(s.turn)+' rad/s',{turn:['+',.3]}],
      ['Afterburner','Ball speed',s=>f(s.spd)+' spd',{spd:['*',.8]}]],
 info:s=>`${f(s.dmg)} dmg · turn ${f(s.turn)} rad/s · ${f(s.spd)} spd`}
];
/* ===================== END CONFIG ===================== */

const CW=36,CH=28,COLS=24,ROWS=20,SIDE=6,W=COLS*CW,H=ROWS*CH,MAXHP=CFG.brickHP,MAXLV=CFG.maxLevel,SD=CFG.suddenDeath;
const COL=['#2f9bff','#ff4d3d'];
const SC=BALLS.findIndex(b=>b.id=='scatter');
function calcStat(b,l){
 const s={...b.base};
 b.ups.forEach((u,j)=>{for(const k in u[3]){
  const [m,v,o={}]=u[3][k];let x=m=='+'?s[k]+v*l[j]:s[k]*(1+v*l[j]);
  if(o.min!=null)x=Math.max(o.min,x);if(o.max!=null)x=Math.min(o.max,x);if(o.int)x=Math.floor(x+1e-9);s[k]=x}});
 return s;
}
document.getElementById('hint').textContent=`Place bricks anywhere on your half: B (Player 1) or numpad 0 (Player 2) arms placing, Esc cancels. Space pauses. After ${Math.floor(SD.start/60)}:${String(SD.start%60).padStart(2,'0')}, healing fades toward ${pc(SD.floor)}.`;
let hp,fl,bl,arm,mouse=null,balls,mon,earn,rate,lv,cnt,mc,S,alive,over,gt,hm,scale=1,acc=0,t0=0,last=1;
const open=[BALLS.map((b,i)=>i==0),BALLS.map((b,i)=>i==0)];
const own=c=>c<COLS/2?0:1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function refresh(p,i){S[p][i]=calcStat(BALLS[i],lv[p][i])}
function init(){
 hp=[];for(let r=0;r<ROWS;r++){hp[r]=new Float32Array(COLS);for(let c=0;c<COLS;c++)if(c<SIDE||c>=COLS-SIDE)hp[r][c]=MAXHP}
 fl=new Float32Array(ROWS*COLS);alive=[ROWS*SIDE,ROWS*SIDE];bl=[CFG.placeBricks,CFG.placeBricks];arm=[false,false];balls=[];mon=[CFG.startCoins,CFG.startCoins];earn=[0,0];rate=[0,0];mc=[0,0];over=-1;gt=0;hm=1;
 lv=[0,1].map(()=>BALLS.map(b=>b.ups.map(()=>0)));cnt=[0,1].map(()=>BALLS.map(()=>0));
 S=[0,1].map(()=>[]);for(let p=0;p<2;p++)BALLS.forEach((b,i)=>refresh(p,i));
 spawn(0,0);spawn(1,0);
 document.getElementById('win').style.display='none';
}
function spawn(p,t){
 const y=40+Math.random()*(H-80);let a=(Math.random()-.5)*1.6;if(p)a+=Math.PI;
 balls.push({p,t,id:BALLS[t].id,x:p?W-SIDE*CW-10:SIDE*CW+10,y,ux:Math.cos(a),uy:Math.sin(a),r:BALLS[t].r,ch:0,tg:null,tt:0});cnt[p][t]++;
}
const buyCost=(p,i)=>Math.round(BALLS[i].cost*CFG.buyGrow**(cnt[p][i]-(i==0?1:0)));
const upCost=(p,i,j)=>{const b=BALLS[i];return Math.round((b.upBase??Math.max(20,b.cost*.9))*(b.upGrow??CFG.upGrow)**lv[p][i][j])};
const owned=p=>cnt[p].reduce((a,b)=>a+b,0);
const getc=(p,v)=>{mon[p]+=v;earn[p]+=v};
function buy(p,i){if(over>=0||i>=BALLS.length||owned(p)>=CFG.ballCap)return;const c=buyCost(p,i);if(mon[p]<c)return;mon[p]-=c;spawn(p,i)}
function up(p,i,j){if(over>=0)return;const l=lv[p][i][j];if(l>=MAXLV)return;const c=upCost(p,i,j);if(mon[p]<c)return;mon[p]-=c;lv[p][i][j]++;refresh(p,i)}

function place(p,r,c){
 if(over>=0||bl[p]<=0||r<0||r>=ROWS||c<0||c>=COLS||own(c)!==p)return;
 if(hp[r][c]>0){if(hp[r][c]>=CFG.brickCap)return;hp[r][c]+=1}else{hp[r][c]=1;alive[p]++}
 fl[r*COLS+c]=1;if(--bl[p]<=0)arm[p]=false;
}
function dmg(r,c,a,p){
 if(r<0||r>=ROWS||c<0||c>=COLS||hp[r][c]<=0||a<=0)return;
 const o=own(c),x=Math.min(hp[r][c],a);hp[r][c]-=x;fl[r*COLS+c]=1;
 if(o!==p)getc(p,x*CFG.coinsPerHP);
 if(hp[r][c]<=.001){hp[r][c]=0;alive[o]--;if(!alive[o]&&over<0){over=1-o;showWin()}}
}
function heal(r,c,a){if(r<0||r>=ROWS||c<0||c>=COLS||hp[r][c]<=0)return;hp[r][c]=Math.max(hp[r][c],Math.min(MAXHP,hp[r][c]+a*hm))}
function nb(r,c,fn){const o=own(c);[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([a,e])=>{if(e>=0&&e<COLS&&own(e)===o)fn(a,e)})}
function minis(b,k){
 const s=S[b.p][SC];
 for(let i=0;i<s.mn&&mc[b.p]<CFG.miniCap;i++){
  const a=Math.random()*6.283,kk=k=='w'?(Math.random()<.5?'d':'h'):k;
  balls.push({p:b.p,t:SC,id:'scatter',mini:1,k:kk,x:b.x,y:b.y,ux:Math.cos(a),uy:Math.sin(a),r:3,life:s.ml});mc[b.p]++;
 }
}
function onHit(b,r,c,dx,dy){
 const p=b.p,o=own(c)===p,s=S[p][b.t];
 if(b.mini){if(b.k=='d'&&!o)dmg(r,c,s.md,p);else if(b.k=='h'&&o)heal(r,c,s.mh);b.life--;return}
 const d=s.dmg||0;
 switch(b.id){
 case 'basic':o?heal(r,c,s.heal):dmg(r,c,d,p);break;
 case 'plasma':if(o){heal(r,c,s.heal);nb(r,c,(a,e)=>heal(a,e,s.heal*s.hs))}else{dmg(r,c,d,p);nb(r,c,(a,e)=>dmg(a,e,d*s.sp,p))}break;
 case 'sniper':if(o)break;if(b.ch>=s.ct){b.ch=0;for(let n=0;n<=s.pn;n++)if(own(c+dx*n)===own(c))dmg(r+dy*n,c+dx*n,s.dmg+n*s.pb,p)}else dmg(r,c,d,p);break;
 case 'scatter':if(!o)dmg(r,c,d,p);minis(b,o?'h':'d');break;
 case 'cannon':if(o)dmg(r,c,s.fr,p);else{dmg(r,c,d,p);if(s.sh)nb(r,c,(a,e)=>dmg(a,e,d*s.sh,p))}break;
 case 'medic':if(o){heal(r,c,s.heal);if(s.au)nb(r,c,(a,e)=>heal(a,e,s.heal*s.au))}break;
 case 'homing':if(!o)dmg(r,c,d,p);break;
 }
}
function fix(b){
 let ux=b.ux,uy=b.uy;const m=.28;
 if(Math.abs(ux)<m)ux=(ux<0?-1:1)*m;if(Math.abs(uy)<m)uy=(uy<0?-1:1)*m;
 const l=Math.hypot(ux,uy);b.ux=ux/l;b.uy=uy/l;
}
function retarget(b){
 let best=1e12,tg=null;const c0=b.p?0:COLS/2;
 for(let r=0;r<ROWS;r++)for(let c=c0;c<c0+COLS/2;c++)if(hp[r][c]>0){
  const d=(c*CW+CW/2-b.x)**2+(r*CH+CH/2-b.y)**2;if(d<best){best=d;tg=[c*CW+CW/2,r*CH+CH/2]}}
 b.tg=tg;
}
function step(dt){
 gt+=dt;hm=gt<SD.start?1:Math.max(SD.floor,1-(gt-SD.start)/SD.len*(1-SD.floor));
 for(let p=0;p<2;p++)getc(p,CFG.trickle*dt);
 for(let i=balls.length-1;i>=0;i--){
  const b=balls[i],s=S[b.p][b.t];
  if(b.id=='sniper')b.ch+=dt;
  if(b.id=='homing'){
   b.tt-=dt;if(b.tt<=0){b.tt=.3;retarget(b)}
   if(b.tg){
    let d=Math.atan2(b.tg[1]-b.y,b.tg[0]-b.x)-Math.atan2(b.uy,b.ux);
    d=Math.atan2(Math.sin(d),Math.cos(d));d=clamp(d,-s.turn*dt,s.turn*dt);
    const a=Math.atan2(b.uy,b.ux)+d;b.ux=Math.cos(a);b.uy=Math.sin(a);
   }
  }
  const sp=(b.mini?s.msp:s.spd)*CFG.unit;
  b.x+=b.ux*sp*dt;b.y+=b.uy*sp*dt;
  let wh=false;
  if(b.x<b.r){b.x=b.r;b.ux=Math.abs(b.ux);wh=true}else if(b.x>W-b.r){b.x=W-b.r;b.ux=-Math.abs(b.ux);wh=true}
  if(b.y<b.r){b.y=b.r;b.uy=Math.abs(b.uy);wh=true}else if(b.y>H-b.r){b.y=H-b.r;b.uy=-Math.abs(b.uy);wh=true}
  if(wh){
   if(b.mini)b.life--;else{if(b.id=='scatter')minis(b,'w');const a=Math.atan2(b.uy,b.ux)+(Math.random()-.5)*.12;b.ux=Math.cos(a);b.uy=Math.sin(a);fix(b)}
  }
  const c0=Math.max(0,Math.floor((b.x-b.r)/CW)),c1=Math.min(COLS-1,Math.floor((b.x+b.r)/CW));
  const r0=Math.max(0,Math.floor((b.y-b.r)/CH)),r1=Math.min(ROWS-1,Math.floor((b.y+b.r)/CH));
  hit:for(let r=r0;r<=r1;r++)for(let c=c0;c<=c1;c++){
   if(hp[r][c]<=0)continue;
   const cx=clamp(b.x,c*CW,c*CW+CW),cy=clamp(b.y,r*CH,r*CH+CH);
   let dx=b.x-cx,dy=b.y-cy;if(!dx&&!dy)dx=-b.ux;
   if(dx*dx+dy*dy<b.r*b.r){
    let sx=0,sy=0;
    if(Math.abs(dx)>Math.abs(dy)){const g=dx>0?1:-1;b.ux=g*Math.abs(b.ux);b.x=cx+g*b.r;sx=-g}
    else{const g=dy>0?1:-1;b.uy=g*Math.abs(b.uy);b.y=cy+g*b.r;sy=-g}
    if(!b.mini)fix(b);
    onHit(b,r,c,sx,sy);
    break hit;
   }
  }
  if(b.mini&&b.life<=0){balls.splice(i,1);mc[b.p]--}
 }
}
/* ---------- UI ---------- */
const P=[document.getElementById('p0'),document.getElementById('p1')];
const R=[[],[]],H2=[];
const pips=l=>'●'.repeat(l)+'○'.repeat(MAXLV-l);
P.forEach((el,p)=>{
 el.innerHTML=`<div class="ph"><h2 style="color:${COL[p]}">Player ${p+1}</h2><b></b><span>coins</span></div><p class="sub"></p><div class="pl"><button class="pb" data-a="p"><span></span><kbd>${p?'N0':'B'}</kbd></button><span class="pd">Then click anywhere on your half: new 1 HP brick, or +1 HP on a brick</span></div>`+
 BALLS.map((t,i)=>`<div class="card"><div class="hd"><button class="tg" data-a="t" data-i="${i}"><canvas class="ic" width="26" height="26"></canvas>${t.name}<span class="cn"></span></button><button class="buy" data-a="b" data-i="${i}"></button></div>
 <div class="bd"><p class="ds">${t.desc}</p><p class="st"></p>${t.ups.map((u,j)=>`<div class="u"><div class="ut">${u[0]}<span class="seg">${'<i></i>'.repeat(MAXLV)}</span></div><div class="ud">${u[1]}</div><div class="uv"><span class="cu"></span><em>→</em><span class="nx"></span></div><button class="ub" data-a="u" data-i="${i}" data-j="${j}"><b></b><small>Upgrade</small></button></div>`).join('')}</div></div>`).join('');
 H2[p]={coin:el.querySelector('.ph b'),sub:el.querySelector('.sub'),pb:el.querySelector('.pb'),pt:el.querySelector('.pb span')};
 el.querySelectorAll('.card').forEach((card,i)=>{
  drawBall(card.querySelector('.ic').getContext('2d'),BALLS[i].id,BALLS[i].color,COL[p],13,13,9,0);
  R[p][i]={card,cn:card.querySelector('.cn'),buy:card.querySelector('.buy'),bt:card.querySelector('.buy'),st:card.querySelector('.st'),
   ups:[...card.querySelectorAll('.u')].map(u=>({seg:[...u.querySelectorAll('.seg i')],cu:u.querySelector('.cu'),nx:u.querySelector('.nx'),cost:u.querySelector('.ub b'),sm:u.querySelector('.ub small'),btn:u.querySelector('.ub')}))};
 });
 /* act on pointerdown so DOM updates can never swallow a click; click only handles keyboard activation */
 const act=e=>{
  const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,a=b.dataset.a;
  if(a=='p'){if(bl[p]>0&&over<0)arm[p]=!arm[p]}else if(a=='t')open[p][i]=!open[p][i];else if(a=='b')buy(p,i);else if(a=='u')up(p,i,+b.dataset.j);
  ui();
 };
 el.addEventListener('mousedown',e=>e.preventDefault());
 el.addEventListener('pointerdown',e=>{if(e.button===0||e.pointerType!=='mouse')act(e)});
 el.addEventListener('click',e=>{if(e.detail===0)act(e)});
});
function set(el,t){if(el._t!==t){el.textContent=t;el._t=t}}
function ui(){
 for(let p=0;p<2;p++){
  set(H2[p].coin,Math.floor(mon[p]));
  set(H2[p].sub,`+${rate[p].toFixed(1)}/s · ${owned(p)}/${CFG.ballCap} balls`);
  set(H2[p].pt,`Place brick ×${bl[p]}`);H2[p].pb.classList.toggle('arm',arm[p]);H2[p].pb.classList.toggle('off',bl[p]<=0||over>=0);
  for(let i=0;i<BALLS.length;i++){
   const r=R[p][i],c=buyCost(p,i),can=over<0&&mon[p]>=c&&owned(p)<CFG.ballCap;
   r.card.classList.toggle('open',open[p][i]);
   set(r.cn,` ×${cnt[p][i]}`);set(r.bt,'Buy '+c);r.buy.classList.toggle('off',!can);
   if(!open[p][i])continue;
   set(r.st,'Now: '+BALLS[i].info(S[p][i]));
   BALLS[i].ups.forEach((u,j)=>{
    const l=lv[p][i][j],ref=r.ups[j],mx=l>=MAXLV,c2=upCost(p,i,j);
    const at=k=>{const a=lv[p][i].slice();a[j]=k;return u[2](calcStat(BALLS[i],a))};
    ref.seg.forEach((g,k)=>g.classList.toggle('on',k<l));set(ref.cu,at(l));set(ref.nx,mx?'max':at(l+1));ref.nx.classList.toggle('mx',mx);
    set(ref.cost,mx?'MAX':String(c2));set(ref.sm,mx?'':'Upgrade');ref.btn.classList.toggle('off',mx||over>=0||mon[p]<c2);
   });
  }
 }
 const m=Math.floor(gt/60),s=Math.floor(gt%60);
 set(document.getElementById('hud'),`${m}:${String(s).padStart(2,'0')} · healing ${Math.round(hm*100)}%`);
}
let pe=[0,0];
setInterval(()=>{for(let p=0;p<2;p++){const r=(earn[p]-pe[p])/.1;pe[p]=earn[p];rate[p]=rate[p]*.95+r*.05}ui()},100);
function showWin(){const w=document.getElementById('win'),t=document.getElementById('wt');t.textContent=`Player ${over+1} wins`;t.style.color=COL[over];w.style.display='flex'}
document.getElementById('re').onclick=()=>{init();pe=[0,0]};
document.getElementById('spd').onclick=e=>{const b=e.target.closest('button');if(b)setScale(+b.dataset.s)};
function setScale(s){scale=s;document.querySelectorAll('#spd button').forEach(b=>b.classList.toggle('on',+b.dataset.s===s))}
addEventListener('keydown',e=>{
 if(e.code=='Space'){e.preventDefault();if(scale){last=scale;setScale(0)}else setScale(last);return}
 if(e.code=='KeyB'&&bl[0]>0&&over<0)arm[0]=!arm[0];
 if(e.code=='Numpad0'&&bl[1]>0&&over<0)arm[1]=!arm[1];
 if(e.code=='Escape')arm=[false,false];
});
/* ---------- draw ---------- */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),dpr=Math.min(devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
const cell=e=>{const q=cv.getBoundingClientRect();return[Math.floor((e.clientY-q.top)/q.height*ROWS),Math.floor((e.clientX-q.left)/q.width*COLS)]};
cv.addEventListener('pointerdown',e=>{const[r,c]=cell(e);if(c<0||c>=COLS)return;const o=own(c);if(o>=0&&arm[o])place(o,r,c);ui()});
cv.addEventListener('pointermove',e=>{mouse=cell(e)});
cv.addEventListener('pointerleave',()=>{mouse=null});
function drawBall(g,id,color,ring,x,y,r,ang){
 g.beginPath();g.arc(x,y,r,0,6.283);g.fillStyle=color;g.fill();g.lineWidth=2;g.strokeStyle=ring;g.stroke();
 g.save();g.translate(x,y);g.strokeStyle=g.fillStyle='#10151f';g.lineWidth=Math.max(1.2,r*.2);g.lineCap='round';g.lineJoin='round';
 const u=r*.58;g.beginPath();
 switch(id){
 case'basic':g.arc(0,0,u*.45,0,6.283);g.fill();break;
 case'plasma':g.moveTo(u*.3,-u);g.lineTo(-u*.5,u*.1);g.lineTo(u*.1,u*.1);g.lineTo(-u*.3,u);g.lineTo(u*.5,-u*.1);g.lineTo(-u*.1,-u*.1);g.closePath();g.fill();break;
 case'sniper':g.arc(0,0,u*.7,0,6.283);g.moveTo(-u*1.2,0);g.lineTo(u*1.2,0);g.moveTo(0,-u*1.2);g.lineTo(0,u*1.2);g.stroke();break;
 case'scatter':[[0,-.55],[-.6,.4],[.6,.4]].forEach(([a,b])=>{g.moveTo(a*u+u*.32,b*u);g.arc(a*u,b*u,u*.32,0,6.283)});g.fill();break;
 case'cannon':for(let k=0;k<4;k++){const a=k*Math.PI/4;g.moveTo(-Math.cos(a)*u*1.1,-Math.sin(a)*u*1.1);g.lineTo(Math.cos(a)*u*1.1,Math.sin(a)*u*1.1)}g.stroke();break;
 case'medic':g.moveTo(-u,0);g.lineTo(u,0);g.moveTo(0,-u);g.lineTo(0,u);g.stroke();break;
 case'homing':g.rotate(ang);g.moveTo(u*1.1,0);g.lineTo(-u*.8,-u*.8);g.lineTo(-u*.5,0);g.lineTo(-u*.8,u*.8);g.closePath();g.fill();break;
 }
 g.restore();
}
function draw(){
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 ctx.fillStyle='rgba(47,155,255,.06)';ctx.fillRect(0,0,W/2,H);
 ctx.fillStyle='rgba(255,77,61,.06)';ctx.fillRect(W/2,0,W/2,H);
 ctx.strokeStyle='#26324a';ctx.setLineDash([6,8]);ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.setLineDash([]);
 const sum=[0,0];
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const h=hp[r][c];if(h<=0)continue;const o=own(c);sum[o]+=h;
  const bx=c*CW,by=r*CH,q=Math.min(1,h/MAXHP);
  ctx.globalAlpha=.4+.6*q;ctx.fillStyle=COL[o];ctx.fillRect(bx+1,by+1,CW-2,CH-2);
  ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(bx+1,by+1,CW-2,2);ctx.fillRect(bx+1,by+1,2,CH-2);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(bx+1,by+CH-3,CW-2,2);ctx.fillRect(bx+CW-3,by+1,2,CH-2);
  ctx.globalAlpha=1;
  if(h>MAXHP){ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(bx+2.5,by+2.5,CW-5,CH-5)}
  if(CFG.brickText){const t=String(+h.toFixed(1));ctx.font="9px 'Press Start 2P',monospace";ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#000';ctx.fillText(t,bx+CW/2+1,by+CH/2+2);ctx.fillStyle='#fff';ctx.fillText(t,bx+CW/2,by+CH/2+1)}
  const fv=fl[r*COLS+c];if(fv>0){ctx.globalAlpha=fv*.7;ctx.fillStyle='#fff';ctx.fillRect(c*CW+1,r*CH+1,CW-2,CH-2);fl[r*COLS+c]=Math.max(0,fv-.08)}
 }
 ctx.globalAlpha=1;
 for(let p=0;p<2;p++)if(arm[p]){const x0=p?W/2:0;ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(x0,0,W/2,H);ctx.strokeStyle=COL[p];ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.strokeRect(x0+1,1,W/2-2,H-2);ctx.setLineDash([])}
 if(mouse){const[r,c]=mouse;if(c>=0&&c<COLS){const o=own(c);if(o>=0&&arm[o]){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(c*CW+1,r*CH+1,CW-2,CH-2)}}}
 for(const b of balls){
  ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.283);
  if(b.mini){ctx.fillStyle=b.k=='d'?COL[b.p]:'#6bff95';ctx.fill();continue}
  drawBall(ctx,b.id,BALLS[b.t].color,COL[b.p],b.x,b.y,b.r,Math.atan2(b.uy,b.ux));
  if(b.id=='sniper'&&b.ch>=S[b.p][b.t].ct){ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,6.283);ctx.strokeStyle='#ffe14a';ctx.stroke()}
 }
 document.getElementById('h0').style.width=Math.min(100,sum[0]/(ROWS*SIDE*MAXHP)*100)+'%';
 document.getElementById('h1').style.width=Math.min(100,sum[1]/(ROWS*SIDE*MAXHP)*100)+'%';
}
function loop(t){
 const dt=Math.min((t-t0)/1000,.05);t0=t;
 if(over<0){acc+=dt*scale;while(acc>=1/120){step(1/120);acc-=1/120}}
 draw();requestAnimationFrame(loop);
}
init();ui();requestAnimationFrame(t=>{t0=t;loop(t)});
</script></body></html>
